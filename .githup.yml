# StuxAPIs Status: https://status.stuxapis.net
# Asks GitHub for a check every 5 minutes (best-effort; GitHub often runs it less often) - .github/workflows/status.yml, using GitHup:
# https://github.com/StuxGroup/GitHup
site:
  name: StuxAPIs Status
  description: Live status of StuxAPIs' APIs and services, checked regularly.
  # Its own badge icon (the StuxAPIs mark with a heartbeat badge), as on services.stuxapis.net.
  logo: https://services.stuxapis.net/assets/img/services/stuxapis-status.png
  favicon: https://services.stuxapis.net/assets/img/services/stuxapis-status.png
  accent: "#BF7FF9"
  url: https://status.stuxapis.net/
  footer_links:
    - label: StuxAPIs Services
      url: https://services.stuxapis.net/
    - label: Report a problem
      url: https://github.com/StuxAPIs/Status/issues/new

legal:
  operator: StuxAPIs
  company: "StuxAPIs is operated by Stux Group Ltd, a company registered in England and Wales (company no. 13160574), registered office 82a James Carter Road, Mildenhall, England, IP28 7DE."
  contact: legal@stuxapis.net
  host: GitHub Pages
  effective: 1 October 2026

defaults:
  timeout: 15
  retries: 2
  max_response_time: 15000  # ms; GitHup's default. Slower (but otherwise good) answers show as degraded

# Monitors are grouped into sections on the page, each with a combined status.
# Slugs come from the names, so moving a monitor between groups keeps its history.
# Not monitored because it does not serve yet: Lunar Calendar (lunarcalendar.stuxapis.net) answers 404.
groups:
  - name: StuxAPIs
    description: The StuxAPIs services and libraries. Lunar Calendar is not listed because its site does not serve yet.
    monitors:
      - name: StuxAPIs
        url: https://stuxapis.net/
        description: The StuxAPIs website
      - name: StuxAPIs Services
        url: https://services.stuxapis.net/
        description: Every StuxAPIs API and service, in one place
      - name: SeasonalOverlaysLibrary
        url: https://seasonaloverlayslibrary.stuxapis.net/
      - name: Kittens
        url: https://kittens.stuxapis.net/
      - name: SecretGen
        url: https://secretgen.stuxapis.net/
      - name: FlashView
        url: https://flashview.stuxapis.net/
        description: Plays SWF (Flash) files in the browser with a self-hosted Ruffle
      - name: GithubStats
        url: https://githubstats.stuxapis.net/
        description: GitHub statistics as an API (the root redirects to its docs)

  - name: Templates
    description: The StuxAPIs page templates, each live as a preview, and the GitHub Pages redirect.
    monitors:
      - name: StuxAPIs Soonpage
        url: https://soonpage.stuxapis.net/
      - name: StuxAPIs Maintenancepage
        url: https://maintenancepage.stuxapis.net/
      - name: StuxAPIs Servicepage
        url: https://servicepage.stuxapis.net/
      - name: StuxAPIs GitHub Pages Redirect
        url: https://stuxapis.github.io/
        description: Redirects stuxapis.github.io to stuxapis.net

  - name: Shared
    description: The media everything StuxAPIs runs relies on.
    monitors:
      - name: StuxAPIs Media CDN
        url: https://global.media.stuxapis.net/icon.png
        description: Shared logos and images used across every StuxAPIs site

incidents:
  labels: [status]
